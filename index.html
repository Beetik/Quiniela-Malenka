<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Perfil · Quiniela Malenka</title>
    <link rel="stylesheet" href="./styles/perfil.css" />
    <link rel="stylesheet" href="./styles/bottom-nav.css" />
  </head>
  <body>
    <main class="profile-shell">
      <header class="profile-topbar">
        <span></span>
        <h1>MI PERFIL</h1>
        <button
          id="settingsBtn"
          class="top-icon"
          type="button"
          aria-label="Configuración"
        >
          ⚙️
        </button>
      </header>

      <section id="profileContent" class="profile-content"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="inicio.html">&#8962;<span>Inicio</span></a>
      <a href="quinielas.html">&#9671;<span>Quinielas</span></a>
      <a href="quiniela_general.html"
        >&#9638;<span>Quiniela<br />General</span></a
      >
      <a href="partidos.html">&#9917;<span>Partidos</span></a>
      <a class="active" href="index.html">&#9679;<span>Perfil</span></a>
    </nav>

    <dialog id="loginDialog" class="profile-dialog">
      <form method="dialog" id="loginForm">
        <h2>Iniciar Sesión</h2>
        <label
          >Nombre (Nickname)<input
            id="loginName"
            type="text"
            autocomplete="name"
            required
        /></label>
        <label
          >Correo electrónico<input
            id="loginEmail"
            type="email"
            autocomplete="email"
            required
        /></label>
        <label
          >Código de Acceso a Quiniela<input
            id="loginCode"
            type="password"
            autocomplete="off"
        /></label>
        <p id="loginError" class="dialog-error"></p>
        <div class="dialog-actions">
          <button id="cancelLoginBtn" class="ghost-btn" type="button">
            Cancelar
          </button>
          <button class="gold-btn" type="submit">Entrar</button>
        </div>
      </form>
    </dialog>

    <dialog id="settingsDialog" class="profile-dialog">
      <form method="dialog" id="settingsForm">
        <h2>Configuración</h2>
        <label
          >Código de Acceso a Quiniela<input
            id="settingsCode"
            type="password"
            autocomplete="off"
        /></label>
        <div class="dialog-actions">
          <button id="closeSettingsBtn" class="ghost-btn" type="button">
            Cerrar
          </button>
          <button class="gold-btn" type="submit">Guardar</button>
        </div>
      </form>
    </dialog>

    <div
      id="toast"
      class="profile-toast"
      role="status"
      aria-live="polite"
    ></div>
    <script type="module" src="./scripts/perfil.js"></script>
  </body>
</html>
