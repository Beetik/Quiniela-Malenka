<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partidos · Quiniela Malenka</title>
    <link rel="stylesheet" href="./styles/partidos.css" />
    <link rel="stylesheet" href="./styles/flags.css" />
    <link rel="stylesheet" href="./styles/bottom-nav.css" />
  </head>
  <body>
    <main class="matches-app">
      <header class="topbar">
        <div class="topbar-row">
          <span class="topbar-spacer"></span>
          <h1 id="pageTitle">PARTIDOS</h1>
          <button
            id="searchToggle"
            class="icon-button"
            type="button"
            aria-label="Buscar equipo, estadio o goleador"
          >
            &#128269;
          </button>
        </div>

        <div id="searchBox" class="search-box" hidden>
          <input
            id="searchInput"
            type="search"
            placeholder="Buscar equipo, estadio o goleador..."
            autocomplete="off"
          />
          <button id="searchClose" class="icon-button" type="button">
            &times;
          </button>
        </div>

        <div class="main-tabs" role="tablist" aria-label="Vista de partidos">
          <button class="main-tab active" data-view="matches" type="button">
            Partidos
          </button>
          <button class="main-tab" data-view="standings" type="button">
            Posiciones
          </button>
        </div>
      </header>

      <section class="sticky-controls">
        <label id="poolSelector" class="pool-selector">
          <span>Quiniela seleccionada</span>
          <select id="poolSelect"></select>
        </label>

        <div id="simulationControl" class="simulation-control" hidden>
          <div>
            <strong id="simulationTitle">MODO REAL</strong>
            <small id="simulationHelp">Solo resultados oficiales</small>
          </div>
          <label class="switch">
            <input id="simulationToggle" type="checkbox" />
            <span class="switch-track"></span>
          </label>
        </div>

        <div id="filterTabs" class="filter-tabs"></div>
      </section>

      <section id="matchesView" class="content-view"></section>
      <section id="standingsView" class="content-view" hidden></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <a href="inicio.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/><path d="M9.5 20v-5h5v5"/></svg><span>Inicio</span></a>
      <a href="quinielas.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8a2 2 0 0 0 2-2h12a2 2 0 0 0 2 2v8a2 2 0 0 0-2 2H6a2 2 0 0 0-2-2Z"/><path d="M9 10h6M9 14h4"/></svg><span>Quinielas</span></a>
      <a href="quiniela_general.html"
        ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h8v3a4 4 0 0 1-8 0Z"/><path d="M8 6H5a3 3 0 0 0 3 5"/><path d="M16 6h3a3 3 0 0 1-3 5"/><path d="M12 12v4"/><path d="M9 20h6"/><path d="M10 16h4v4h-4z"/></svg><span>Quiniela<br />General</span></a
      >
      <a class="active" href="partidos.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m12 7 4 3-1.5 4.5h-5L8 10Z"/><path d="M12 7V3.5M8 10 4.6 8.5M9.5 14.5 7.5 19M14.5 14.5l2 4.5M16 10l3.4-1.5"/></svg><span>Partidos</span></a>
      <a href="index.html"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/><path d="M17 13.5 19 15l-2 3-2-3Z"/></svg><span>Perfil</span></a>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./scripts/partidos.js"></script>
  </body>
</html>
